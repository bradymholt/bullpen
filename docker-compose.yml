services:
  bullpen:
    # Built here for local work; the server pulls the same tag from GHCR.
    build:
      context: .
      args:
        # Optional: a gogcli release asset for Linux. See README, "Running headless".
        GOG_URL: ${GOG_URL:-}
        # Set to 1 for the Playwright MCP server and a headless Chromium (~250MB).
        WITH_BROWSER: ${WITH_BROWSER:-}
    image: ghcr.io/bradymholt/bullpen:latest
    pull_policy: missing
    restart: unless-stopped
    ports:
      # Loopback only: the dashboard has no auth, so nothing but this box
      # should reach it. Put a proxy in front for the webhook path alone.
      - "127.0.0.1:4322:4322"
    volumes:
      # Also holds /data/claude (skills, settings.json — CLAUDE_CONFIG_DIR) and
      # /data/gog (gog's OAuth tokens and keyring). Back this up and you have
      # every secret the agents use; .env holds only what starts the process.
      - bullpen-data:/data
    environment:
      TZ: ${TZ:-UTC}
      # Subscription auth: `claude setup-token` on a logged-in machine.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  bullpen-data:
