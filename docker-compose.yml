services:
  bullpen:
    build: .
    image: bullpen
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - bullpen-data:/data
    environment:
      TZ: ${TZ:-UTC}
      # Subscription auth: `claude setup-token` on a logged-in machine.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  bullpen-data:
