services:
  bullpen:
    # Built here for local work; the server pulls the same tag from GHCR.
    build: .
    image: ghcr.io/bradymholt/bullpen:latest
    pull_policy: missing
    restart: unless-stopped
    ports:
      # Loopback only: the dashboard has no auth, so nothing but this box
      # should reach it. Put a proxy in front for the webhook path alone.
      - "127.0.0.1:4322:4322"
    volumes:
      - bullpen-data:/data
    environment:
      TZ: ${TZ:-UTC}
      # Subscription auth: `claude setup-token` on a logged-in machine.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}

volumes:
  bullpen-data:
