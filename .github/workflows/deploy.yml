name: deploy

# Runs after `build` has pushed main's sha, or by hand for a sha that already has an image.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Git sha to deploy (an image for it must exist)
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags and releases
      packages: write   # re-tag the deployed image with the release name
    env:
      VERSION: ${{ inputs.version || github.event.workflow_run.head_sha || github.sha }}
      # One release per deploy, numbered by this workflow's run: v0.17, v0.18, …
      # while this is pre-1.0. The tag is known before the deploy so the running
      # app can link to it.
      RELEASE_TAG: v0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: gem install kamal --no-document

      # A key authorized for the deploy user on the box; nothing else uses it.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_KEY }}

      # Pinned rather than scanned, so a swapped box fails instead of being trusted.
      - run: |
          mkdir -p ~/.ssh
          echo "${{ vars.KAMAL_HOST_KEY }}" >> ~/.ssh/known_hosts

      # .kamal/secrets reads the registry password from GITHUB_TOKEN; the job's
      # token can pull this repo's package.
      - run: kamal deploy --skip-push --version "$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BULLPEN_RELEASE: ${{ env.RELEASE_TAG }}

      # Only after the box is running it: a failed deploy leaves no release behind.
      # The image gets the release name as a second tag (a manifest re-tag, no
      # rebuild) and the release notes name the image, so the two are one thing.
      - run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" "$IMAGE:$VERSION"
          # The package page for this exact image version, when the API will tell us its id.
          OWNER="${{ github.repository_owner }}"; NAME="${{ github.event.repository.name }}"
          VID=$(gh api "/users/$OWNER/packages/container/$NAME/versions?per_page=30" \
                 --jq ".[] | select(.metadata.container.tags | index(\"$VERSION\")) | .id" 2>/dev/null | head -1 || true)
          if [ -n "$VID" ]; then
            NOTES="Image: [\`$IMAGE:$RELEASE_TAG\`](https://github.com/$OWNER/$NAME/pkgs/container/$NAME/$VID?tag=$RELEASE_TAG) — also tagged \`$VERSION\`"
          else
            NOTES="Image: \`$IMAGE:$RELEASE_TAG\` (also \`$IMAGE:$VERSION\`)"
          fi
          # The box is already running this version; a refused release call (GitHub
          # has returned a stray 403 here) is retried, then reported, never a failure.
          for attempt in 1 2 3; do
            if gh release create "$RELEASE_TAG" --target "$VERSION" --title "$RELEASE_TAG" --generate-notes --notes "$NOTES"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::warning::deployed $VERSION but could not create release $RELEASE_TAG; create it by hand: gh release create $RELEASE_TAG --target $VERSION --title $RELEASE_TAG --generate-notes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
